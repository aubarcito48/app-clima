<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" opacity=".28">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="linearRGB">
      <feTurbulence type="turbulence" baseFrequency=".2" numOctaves="4" seed="15" stitchTiles="stitch" result="noise"/>
      <feSpecularLighting in="noise" surfaceScale="26" specularConstant="3" specularExponent="20" lighting-color="#3d9abd">
        <feDistantLight azimuth="3" elevation="178"/>
      </feSpecularLighting>
    </filter>
  </defs>
  <rect width="700" height="700" fill="#205b7d" filter="url(#grain)"/>
</svg>
