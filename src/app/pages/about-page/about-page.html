<a href="#main-content" class="skip-link">{{ 'Saltar al contenido' | translate }}</a>
<div class="mx-auto min-h-screen max-w-400 lg:grid lg:grid-cols-[16.5rem_minmax(0,1fr)]">
  <app-weather-sidebar (placeSelected)="selectPlace($event)">
    <app-isabel [sidebar]="true" [presenceOnly]="true" />
  </app-weather-sidebar>
  <div class="min-w-0 px-5 py-6 sm:px-8 lg:px-10 lg:pb-10 lg:pt-8">
    <main id="main-content" tabindex="-1" class="pb-10">
      <h1 class="sr-only">{{ 'Sobre nosotros' | translate }}</h1>
      <app-about />
    </main>
    <app-site-footer />
  </div>
</div>
<app-back-to-top />
<app-section-navigation [sections]="sections" />
