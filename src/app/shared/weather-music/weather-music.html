@if (playlist(); as selection) {
  <section id="musica" [attr.aria-label]="'Música para tu clima' | translate" class="min-w-0">
    <iframe
      class="block w-full rounded-xl border-0"
      [src]="embedUrl()"
      [title]="'Spotify: ' + selection.name"
      width="100%"
      height="80"
      loading="lazy"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      allowfullscreen
    ></iframe>
  </section>
}
