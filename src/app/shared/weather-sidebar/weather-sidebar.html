<aside class="stitch-sidebar">
  <a
    href="./"
    aria-label="StitchWeather, inicio"
    class="relative flex items-center gap-3 rounded-xl"
  >
    <span class="stitch-logo" aria-hidden="true">S</span>
    <span
      ><span class="block font-display text-lg font-bold tracking-tight text-ink"
        >Stitch<span class="text-orange-800">Weather</span></span
      ><span class="mt-0.5 block text-[10px] font-semibold tracking-[0.16em] text-secondary"
        >TU CLIMA, MÁS AZUL</span
      ></span
    >
  </a>
  <div class="relative mt-6 min-w-0">
    <app-weather-music [weather]="weather()" />
  </div>
  <div class="sidebar-note">
    <img
      src="stitch-coast.svg"
      alt=""
      aria-hidden="true"
      width="160"
      height="135"
      class="mx-auto mb-3 w-32"
    />
    <p class="font-display text-base font-bold">Un clima para cada aventura.</p>
    <p class="mt-2 text-xs leading-6">Buscá tu lugar y descubrí cómo sigue el día.</p>
  </div>
</aside>
