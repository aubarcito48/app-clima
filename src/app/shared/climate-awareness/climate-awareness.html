<section
  class="awareness-slider"
  [attr.aria-label]="'Concientización climática' | translate"
  [attr.aria-roledescription]="'carrusel' | translate"
  (keydown)="onKeydown($event)"
>
  <div
    #stage
    class="image-stage"
    (pointerdown)="pointerDown($event)"
    (pointerup)="pointerUp($event)"
    (pointercancel)="cancelPointer()"
  >
    @for (slide of slides; track slide.id; let index = $index) {
      <figure
        class="awareness-slide"
        [hidden]="active() !== index"
        role="group"
        [attr.aria-roledescription]="'diapositiva' | translate"
        [attr.aria-label]="
          '{index} de {total}' | translate: { index: index + 1, total: slides.length }
        "
      >
        <img
          [src]="slide.src"
          [alt]="slide.alt | translate"
          [width]="slide.width"
          [height]="slide.height"
          [attr.loading]="index === 0 ? 'eager' : 'lazy'"
          draggable="false"
        />
        <figcaption>
          <h2 class="font-display text-sm font-bold leading-5">{{ slide.title | translate }}</h2>
          <p class="mt-1 text-xs leading-5">{{ slide.message | translate }}</p>
        </figcaption>
      </figure>
    }
    <button
      type="button"
      class="image-toggle"
      [attr.aria-label]="
        paused()
          ? ('Reanudar presentación ambiental' | translate)
          : ('Pausar presentación ambiental' | translate)
      "
      [attr.title]="
        paused() ? ('Tocá para reanudar' | translate) : ('Tocá para pausar' | translate)
      "
      (click)="toggleRotation()"
    ></button>
  </div>
  <div class="slider-controls">
    <div
      class="flex items-center"
      role="group"
      [attr.aria-label]="'Elegir imagen ambiental' | translate"
    >
      @for (slide of slides; track slide.id; let index = $index) {
        <button
          type="button"
          class="slide-dot"
          [attr.aria-label]="
            'Ver imagen {index}: {title}'
              | translate: { index: index + 1, title: (slide.title | translate) }
          "
          [attr.aria-current]="active() === index ? 'true' : null"
          (focus)="paused.set(true)"
          (click)="select(index)"
        >
          <span aria-hidden="true"></span>
        </button>
      }
    </div>
  </div>
  <p class="sr-only" [attr.aria-live]="paused() ? 'polite' : 'off'" aria-atomic="true">
    {{ 'Imagen' | translate }} {{ active() + 1 }} {{ 'de' | translate }} {{ slides.length }}:
    {{ slides[active()].title | translate }}.
  </p>
</section>
