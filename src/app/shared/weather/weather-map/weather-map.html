<section
  class="map-card rounded-app border border-line bg-surface p-4 sm:p-5"
  aria-labelledby="weather-map-heading"
>
  <div class="flex flex-wrap items-center justify-between gap-2">
    <h2 id="weather-map-heading" class="font-display text-lg font-bold text-ink">
      {{ 'Mapa del clima' | translate }}
    </h2>
    @if (opened()) {
      <label class="text-xs font-semibold text-secondary">
        <span class="sr-only">{{ 'Mostrar' | translate }}</span>
        <select
          class="min-h-11 rounded-control border border-control-line bg-surface px-3 text-ink"
          [value]="layer()"
          (change)="changeLayer($any($event.target).value)"
        >
          <option value="temperature">{{ 'Temperatura' | translate }}</option>
          <option value="rain">{{ 'Lluvia' | translate }}</option>
          <option value="wind">{{ 'Viento' | translate }}</option>
        </select>
      </label>
    }
  </div>
  <div [hidden]="!opened()" class="map-content mt-3">
    <div
      #mapContainer
      class="map-canvas rounded-app"
      role="region"
      [attr.aria-label]="'Mapa meteorológico interactivo' | translate"
    ></div>
    @if (failed() || loading()) {
      <p class="mt-2 text-xs leading-5 text-secondary" role="status">
        @if (failed()) {
          {{
            'No se pudo cargar todo el mapa. Esperá un minuto y volvé a consultar la ciudad.'
              | translate
          }}
        } @else if (loading()) {
          {{ 'Cargando mapa…' | translate }}
        }
      </p>
    }
  </div>
</section>
