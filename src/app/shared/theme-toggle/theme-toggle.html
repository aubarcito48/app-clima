<button
  type="button"
  class="flex min-h-11 min-w-11 shrink-0 items-center justify-center gap-1.5 rounded-control border border-control-line bg-surface px-2.5 text-xs font-semibold text-blue hover:bg-sky"
  [attr.aria-label]="
    theme.mode() === 'dark'
      ? ('Activar modo claro' | translate)
      : ('Activar modo oscuro' | translate)
  "
  [attr.title]="
    theme.mode() === 'dark'
      ? ('Activar modo claro' | translate)
      : ('Activar modo oscuro' | translate)
  "
  (click)="theme.toggle($event)"
>
  <app-weather-icon [name]="theme.mode() === 'dark' ? 'moon' : 'sun'" [size]="18" />
  <span class="whitespace-nowrap">{{
    theme.mode() === 'dark' ? ('Modo oscuro' | translate) : ('Modo claro' | translate)
  }}</span>
</button>
