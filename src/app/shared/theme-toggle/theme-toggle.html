<button
  type="button"
  class="flex min-h-11 min-w-11 shrink-0 items-center justify-center gap-2 rounded-2xl border border-control-line bg-surface px-3 text-sm font-semibold text-blue hover:bg-sky"
  [attr.aria-label]="theme.mode() === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro'"
  [attr.title]="theme.mode() === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro'"
  (click)="theme.toggle()"
>
  <app-weather-icon [name]="theme.mode() === 'dark' ? 'sun' : 'moon'" [size]="21" />
  <span class="hidden sm:inline">{{ theme.mode() === 'dark' ? 'Modo claro' : 'Modo oscuro' }}</span>
</button>
