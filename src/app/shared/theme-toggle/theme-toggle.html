<button
  type="button"
  class="flex min-h-11 min-w-11 shrink-0 items-center justify-center gap-2 rounded-2xl border border-control-line bg-surface px-3 text-sm font-semibold text-blue hover:bg-sky"
  [attr.aria-label]="
    theme.mode() === 'dark'
      ? ('Activar modo claro' | translate)
      : ('Activar modo oscuro' | translate)
  "
  [attr.title]="
    theme.mode() === 'dark'
      ? ('Activar modo claro' | translate)
      : ('Activar modo oscuro' | translate)
  "
  (click)="theme.toggle()"
>
  <app-weather-icon [name]="theme.mode() === 'dark' ? 'sun' : 'moon'" [size]="21" />
  <span class="hidden sm:inline">{{
    theme.mode() === 'dark' ? ('Modo claro' | translate) : ('Modo oscuro' | translate)
  }}</span>
</button>
