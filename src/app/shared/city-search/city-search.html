<form
  (submit)="submit($event)"
  aria-label="Buscar el clima de una ciudad"
  aria-describedby="demo-help"
>
  <div class="grid items-end gap-3 sm:grid-cols-[minmax(0,1fr)_8rem_auto]">
    <div class="min-w-0">
      <label for="city" class="mb-2 block text-sm font-semibold text-ink"
        >¿Dónde querés consultar?</label
      >
      <div class="relative">
        <app-weather-icon
          name="search"
          class="pointer-events-none absolute top-1/2 left-4 -translate-y-1/2 text-muted"
          [size]="20"
        />
        <input
          id="city"
          name="city"
          type="search"
          placeholder="Buscá una ciudad"
          autocomplete="address-level2"
          required
          [value]="city()"
          (input)="city.set($any($event.target).value)"
          class="field w-full pr-4 pl-12"
        />
      </div>
    </div>
    <div>
      <label for="country" class="mb-2 block text-sm font-semibold text-ink"
        >País <span class="font-normal text-muted">(opcional)</span></label
      >
      <input
        id="country"
        name="country"
        placeholder="Ej. AR"
        autocomplete="country"
        [value]="country()"
        (input)="country.set($any($event.target).value)"
        class="field w-full px-4"
      />
    </div>
    <button
      type="submit"
      [disabled]="busy()"
      class="primary-button flex h-13 items-center justify-center gap-3 px-7 sm:min-w-39"
    >
      {{ busy() ? 'Cargando…' : 'Ver clima' }} <app-weather-icon name="arrow" [size]="18" />
    </button>
  </div>
  <div class="mt-4 flex flex-wrap items-center gap-x-2 gap-y-2 text-xs sm:text-sm">
    <span class="mr-1 text-muted">Probá con</span>
    @for (example of examples; track example) {
      <button
        type="button"
        [disabled]="busy()"
        (click)="chooseExample(example)"
        class="example-button"
      >
        {{ example }}
      </button>
    }
  </div>
  <p id="demo-help" class="mt-3 text-xs leading-relaxed text-muted">
    Demo visual: las ciudades de ejemplo muestran datos ficticios, no el clima actual.
  </p>
</form>
